input {
  beats {
    port => 5044
    client_inactivity_timeout => 300
  }
}

filter {
  if [type] == "application" {
    grok {
      match => {
        "message" => "%{TIMESTAMP_ISO8601:timestamp}\s+\[%{DATA:thread}\]\s+\[%{DATA:traceId}\]\s+%{LOGLEVEL:level}\s+%{DATA:logger}\s+-\s+%{GREEDYDATA:message_detail}"
      }
      overwrite => ["message"]
    }

    date {
      match => ["timestamp", "yyyy-MM-dd HH:mm:ss.SSS"]
      target => "@timestamp"
    }

    if [traceId] {
      mutate {
        add_field => { "[@metadata][trace_id]" => "%{traceId}" }
      }
    }

    if [level] == "ERROR" or [level] == "WARN" {
      mutate {
        add_tag => ["alert"]
      }
    }
  }

  if [type] == "access-log" {
    json {
      source => "message"
    }

    date {
      match => ["time_local", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
    }

    if [status] >= 500 {
      mutate { add_tag => ["error_response"] }
    }

    if [request_time] and [request_time] > 3.0 {
      mutate { add_tag => ["slow_request"] }
    }
  }

  if [type] == "error-log" {
    grok {
      match => {
        "message" => "%{DATA:timestamp} \[%{DATA:log_level}\] %{GREEDYDATA:error_message}"
      }
    }
  }

  if [kubernetes] {
    mutate {
      add_field => {
        "[@metadata][k8s_namespace]" => "%{[kubernetes][namespace]}"
        "[@metadata][k8s_pod]" => "%{[kubernetes][pod][name]}"
      }
    }
  }

  mutate {
    remove_field => ["@version", "host", "agent", "ecs"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch-service.logging.svc.cluster.local:9200"]
    index => "seckill-%{type}-%{+YYYY.MM.dd}"
    template_name => "seckill"
    template_overwrite => true
    manage_template => true
    ilm_enabled => true
    ilm_rollover_alias => "seckill-%{type}"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "seckill-log-policy"
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    ssl => false
    bulk_path => "/_bulk"
    idle_flush_time => 1
    sniffing => false
    document_id => "%{[@metadata][_id]}"
  }

  stdout {
    codec => rubydebug
  }
}