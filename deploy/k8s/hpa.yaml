apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: seckill-app-hpa
  namespace: seckill
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: seckill-app
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    - type: Pods
      pods:
        metric:
          name: http_server_requests_seconds_count
          selector:
            matchLabels:
              uri: "/api/v1/seckill/execute"
        target:
          type: AverageValue
          averageValue: "5000"

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: seckill-app-sa
  namespace: seckill

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seckill-app-role
  namespace: seckill
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seckill-app-rb
  namespace: seckill
subjects:
  - kind: ServiceAccount
    name: seckill-app-sa
    namespace: seckill
roleRef:
  kind: Role
  name: seckill-app-role
  apiGroup: rbac.authorization.k8s.io

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: seckill-app-pdb
  namespace: seckill
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: seckill-app