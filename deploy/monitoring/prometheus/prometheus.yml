global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: seckill-prod
    environment: production

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager-service.monitoring.svc.cluster.local:9093

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "seckill-app"
    metrics_path: "/actuator/prometheus"
    scheme: http
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["seckill"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: app
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)

  - job_name: "jmx-exporter"
    metrics_path: "/metrics"
    scheme: http
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: ["seckill"]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: seckill-app
      - source_labels: [__address__]
        action: replace
        regex: ([^:]+)(?::\d+)?
        replacement: $1:9404
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod

  - job_name: "nginx"
    metrics_path: /metrics
    static_configs:
      - targets: ["nginx-exporter-service.monitoring.svc.cluster.local:9113"]

  - job_name: "redis-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["redis-exporter-service.seckill.svc.cluster.local:9121"]

  - job_name: "mysql-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["mysql-exporter-service.seckill.svc.cluster.local:9104"]

  - job_name: "kafka-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["kafka-exporter-service.seckill.svc.cluster.local:9308"]

  - job_name: "node-exporter"
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - source_labels: [__address__]
        action: replace
        regex: ([^:]+)(?::\d+)?
        replacement: $1:9100
        target_label: __address__

  - job_name: "kube-state-metrics"
    metrics_path: /metrics
    static_configs:
      - targets: ["kube-state-metrics.kube-system.svc.cluster.local:8080"]

  - job_name: "kubernetes-cadvisor"
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - source_labels: [__address__]
        action: replace
        regex: ([^:]+)(?::\d+)?
        replacement: $1:10250
        target_label: __address__
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /metrics/cadvisor