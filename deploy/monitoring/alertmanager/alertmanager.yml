global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.company.com:587"
  smtp_from: "alertmanager@seckill.com"
  smtp_auth_username: "alertmanager@seckill.com"
  smtp_auth_password: ""
  smtp_require_tls: true
  wechat_api_url: "https://qyapi.weixin.qq.com/cgi-bin/"
  wechat_api_corp_id: ""

templates:
  - "/etc/alertmanager/templates/*.tmpl"

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default-receiver"
  routes:
    - match:
        severity: critical
      receiver: "critical-receiver"
      continue: true
    - match:
        severity: warning
      receiver: "warning-receiver"
    - match_re:
        alertname: ServiceDown|HighErrorRate|PodRestartingFrequently
      receiver: "oncall-receiver"

receivers:
  - name: "default-receiver"
    slack_configs:
      - channel: "#monitoring"
        send_resolved: true
        title: "{{ .GroupLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}"

  - name: "critical-receiver"
    slack_configs:
      - channel: "#critical-alerts"
        send_resolved: true
        title: "[CRITICAL] {{ .GroupLabels.alertname }}"
        text: |
          *Alert:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Severity:* {{ .CommonLabels.severity }}
    email_configs:
      - to: "oncall@seckill.com"
        send_resolved: true
        headers:
          Subject: "[CRITICAL] {{ .GroupLabels.alertname }}"

  - name: "warning-receiver"
    slack_configs:
      - channel: "#monitoring-warning"
        send_resolved: true
        title: "[WARNING] {{ .GroupLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}"

  - name: "oncall-receiver"
    slack_configs:
      - channel: "#oncall"
        send_resolved: true
        title: "[ONCALL] {{ .GroupLabels.alertname }}"
        text: "{{ .CommonAnnotations.description }}"
    email_configs:
      - to: "oncall-phone@seckill.com"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]